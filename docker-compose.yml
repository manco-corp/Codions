services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: codions-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - codions-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    container_name: codions-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - codions-network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Pull LLM models into Ollama so the bot can use them. Run once: docker compose run ollama-pull
  ollama-pull:
    image: alpine:3.19
    container_name: codions-ollama-pull
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        apk add --no-cache curl
        echo "Pulling qwen2.5-coder:7b..."
        curl -sSf --max-time 3600 -X POST http://ollama:11434/api/pull -H "Content-Type: application/json" -d "{\"model\":\"qwen2.5-coder:7b\",\"stream\":false}"
        echo "Pulling qwen2.5-coder:14b..."
        curl -sSf --max-time 3600 -X POST http://ollama:11434/api/pull -H "Content-Type: application/json" -d "{\"model\":\"qwen2.5-coder:14b\",\"stream\":false}"
        echo "Pulling qwen2.5-coder:32b..."
        curl -sSf --max-time 3600 -X POST http://ollama:11434/api/pull -H "Content-Type: application/json" -d "{\"model\":\"qwen2.5-coder:32b\",\"stream\":false}"
        echo "All models pulled."
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    networks:
      - codions-network

  codions-bot:
    build:
      context: .
      dockerfile: docker/bot/Dockerfile
    image: codions-bot:latest
    profiles:
      - build
    networks:
      - codions-network

networks:
  codions-network:
    name: codions-network
    driver: bridge

volumes:
  sqlserver-data:
  ollama-data:
